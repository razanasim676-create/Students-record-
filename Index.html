<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record & Attendance System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .form-card {
            background: #f8fafc;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2b6cb0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-grid input {
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        .form-grid input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 2px rgba(49,130,206,0.2);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background-color: #2c5282;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            background: #edf2f7;
            padding: 12px 18px;
            border-radius: 8px;
        }

        .date-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #2d3748;
        }

        .date-picker input {
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 15px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #2d3748;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f7fafc;
        }

        .status-btn {
            padding: 7px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.1s;
        }

        .status-btn:active {
            transform: scale(0.95);
        }

        .present {
            background-color: #38a169;
            color: white;
        }

        .absent {
            background-color: #e53e3e;
            color: white;
        }

        .delete-btn {
            background-color: #a0aec0;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #718096;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Record & Attendance Management</h1>

    <div class="form-card">
        <div class="form-title">Naya Student Register Karein</div>
        <div class="form-grid">
            <input type="text" id="studentName" placeholder="Student ka Name" required>
            <input type="text" id="fatherName" placeholder="Father's Name" required>
            <input type="text" id="bookName" placeholder="Book / Kitab ka Name" required>
        </div>
        <button class="add-btn" onclick="addStudent()">+ Save Student Record</button>
    </div>

    <div class="controls">
        <div class="date-picker">
            <label for="attendanceDate">Select Date:</label>
            <input type="date" id="attendanceDate" onchange="renderTable()">
        </div>
        <div id="totalCount" style="font-weight: 600; color: #4a5568;">Total Students: 0</div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Student Name</th>
                    <th>Father's Name</th>
                    <th>Book Name</th>
                    <th>Hajri (Status)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    document.getElementById('attendanceDate').valueAsDate = new Date();

    let students = JSON.parse(localStorage.getItem('student_records')) || [];
    let attendanceData = JSON.parse(localStorage.getItem('attendance_records')) || {};

    function saveData() {
        localStorage.setItem('student_records', JSON.stringify(students));
        localStorage.setItem('attendance_records', JSON.stringify(attendanceData));
    }

    function addStudent() {
        const sName = document.getElementById('studentName').value.trim();
        const fName = document.getElementById('fatherName').value.trim();
        const bName = document.getElementById('bookName').value.trim();

        if (sName === '' || fName === '' || bName === '') {
            alert('Kripya saare fields (Student Name, Father Name, Book Name) bharein!');
            return;
        }

        const newStudent = {
            id: Date.now().toString(),
            studentName: sName,
            fatherName: fName,
            bookName: bName
        };

        students.push(newStudent);
        saveData();

        document.getElementById('studentName').value = '';
        document.getElementById('fatherName').value = '';
        document.getElementById('bookName').value = '';

        renderTable();
    }

    function toggleAttendance(studentId) {
        const selectedDate = document.getElementById('attendanceDate').value;
        if (!selectedDate) {
            alert('Pehle Date select karein!');
            return;
        }

        if (!attendanceData[selectedDate]) {
            attendanceData[selectedDate] = {};
        }

        const currentStatus = attendanceData[selectedDate][studentId] || 'Absent';
        attendanceData[selectedDate][studentId] = (currentStatus === 'Present') ? 'Absent' : 'Present';

        saveData();
        renderTable();
    }

    function deleteStudent(studentId) {
        if (confirm('Kya aap is student ka record delete karna chahte hain?')) {
            students = students.filter(s => s.id !== studentId);
            saveData();
            renderTable();
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('studentTableBody');
        const selectedDate = document.getElementById('attendanceDate').value;
        const totalCountDiv = document.getElementById('totalCount');

        tableBody.innerHTML = '';
        totalCountDiv.innerText = `Total Students: ${students.length}`;

        if (students.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: #718096; padding: 20px;">Koi student record nahi mila. Upar diye gaye form se add karein.</td></tr>';
            return;
        }

        students.forEach((student, index) => {
            const status = (attendanceData[selectedDate] && attendanceData[selectedDate][student.id]) 
                           ? attendanceData[selectedDate][student.id] 
                           : 'Absent';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${student.studentName}</strong></td>
                <td>${student.fatherName}</td>
                <td>${student.bookName}</td>
                <td>
                    <button class="status-btn ${status.toLowerCase()}" onclick="toggleAttendance('${student.id}')">
                        ${status}
                    </button>
                </td>
                <td>
                    <button class="delete-btn" onclick="deleteStudent('${student.id}')">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    renderTable();
</script>

</body>
</html>
